name: Weekly Paper Collection (Manual)

on:
  workflow_dispatch:  # 수동 트리거 전용 (크론은 Netlify Scheduled Function이 담당)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger paper collection (Netlify Background Function)
        run: |
          response=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "https://labpaper.netlify.app/api/papers/collect" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response.txt

          # Background function은 항상 202를 즉시 반환 (비동기 실행, 최대 15분)
          # 이메일 알림은 collect 함수 내부에서 자동 발송됨
          if [ "$response" != "202" ]; then
            echo "Unexpected status: $response"
            exit 1
          fi

          echo "Collection triggered. Background function running (up to 15 min) — email will be sent automatically."

name: Weekly Paper Collection

on:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:       # 수동 트리거 허용

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger paper collection (Netlify Background Function)
        run: |
          response=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "https://labpaper.netlify.app/api/papers/collect" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/response.txt

          # Background function은 항상 202를 즉시 반환 (비동기 실행, 최대 15분)
          if [ "$response" != "202" ]; then
            echo "Unexpected status: $response"
            exit 1
          fi

          echo "Collection triggered. Background function is running (up to 15 min)."

  notify:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Wait for background function to complete
        run: sleep 900  # 15분 대기 (백그라운드 함수 최대 실행 시간)

      - name: Send newsletter emails via notify API
        run: |
          response=$(curl -s -o /tmp/notify_response.txt -w "%{http_code}" \
            -X POST "https://labpaper.netlify.app/api/notify" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          echo "HTTP status: $response"
          echo "Response body:"
          cat /tmp/notify_response.txt

          if [ "$response" != "200" ]; then
            echo "Notify failed with status $response"
            exit 1
          fi

          echo "Emails sent successfully."
